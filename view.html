<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer — Let's Explore DMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Floating Control Bar for Viewer */
    .viewer-bar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #FFFFFF;
      border-bottom: 1px solid #DCE4EF;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(23, 54, 93, 0.08);
      gap: 12px;
      flex-wrap: wrap;
    }
    .viewer-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Inter', sans-serif;
    }
    .viewer-brand strong {
      color: #17365D;
      font-size: 15px;
      font-weight: 800;
    }
    .viewer-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #DCEBFA;
      color: #3977B8;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-viewer-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-download-pdf {
      background: #16A34A;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
    }
    .btn-download-pdf:hover {
      background: #15803D;
      transform: translateY(-1px);
    }
    .btn-print {
      background: #3977B8;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(57, 119, 184, 0.25);
    }
    .btn-print:hover {
      background: #2D6298;
    }
    .btn-edit {
      background: #F4F7FB;
      border: 1px solid #DCE4EF;
      color: #17365D;
    }
    .btn-edit:hover {
      background: #E2E8F0;
    }

    /* Format Switcher Pills in Viewer Bar */
    .viewer-formats {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 8px;
    }
    .btn-fmt-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #DCE4EF;
      background: #F8FAFC;
      color: #334155;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-fmt-pill:hover {
      background: #E2E8F0;
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .btn-fmt-pill.active {
      background: #17365D;
      color: #FFFFFF;
      border-color: #17365D;
      box-shadow: 0 2px 6px rgba(23, 54, 93, 0.2);
    }

    /* Print Preview Canvas */
    .document-viewport {
      max-width: 900px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }
    .printable-sheet {
      background: #FFFFFF;
      box-shadow: 0 10px 30px rgba(23, 54, 93, 0.1);
      border: 1px solid #DCE4EF;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Loading and Error states */
    .viewer-loading {
      text-align: center;
      padding: 80px 20px;
      color: #64748B;
      font-size: 15px;
    }

    @media print {
      .viewer-bar {
        display: none !important;
      }
      .document-viewport {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .printable-sheet {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body style="background: #F4F7FB; margin: 0; padding: 0;">

  <!-- Floating Control Bar -->
  <div class="viewer-bar" id="viewerBar">
    <div class="viewer-brand">
      <a href="inquiry-admin/inquiries.html" style="text-decoration:none; color:#17365D; display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-arrow-left" style="font-size:13px; color:#64748B;"></i>
        <strong>Let's Explore DMC</strong>
      </a>
      <span class="viewer-badge" id="refBadge">Loading...</span>
    </div>

    <!-- Quick Format Switcher in Viewer -->
    <div class="viewer-formats" id="viewerFormats">
      <button class="btn-fmt-pill active" data-doctype="quotation" onclick="switchViewerFormat('quotation')" title="Master Commercial Quotation">
        📄 Quotation
      </button>
      <button class="btn-fmt-pill" data-doctype="itinerary" onclick="switchViewerFormat('itinerary')" title="Day-by-day Travel Itinerary">
        🗺️ Itinerary
      </button>
      <button class="btn-fmt-pill" data-doctype="hotel_costing" onclick="switchViewerFormat('hotel_costing')" title="3-Tier Hotel Costing Sheet">
        🏨 Hotel Costing
      </button>
      <button class="btn-fmt-pill" data-doctype="summary" onclick="switchViewerFormat('summary')" title="Package Summary">
        📋 Summary
      </button>
      <button class="btn-fmt-pill" data-doctype="confirmation" onclick="switchViewerFormat('confirmation')" title="Official Luxury Hotel Booking Voucher">
        🏨 Hotel Voucher
      </button>
      <button class="btn-fmt-pill" data-doctype="invoice" onclick="switchViewerFormat('invoice')" title="Corporate Tax Invoice">
        🧾 Tax Invoice
      </button>
    </div>

    <div class="viewer-actions">
      <!-- Direct 1-Click PDF Download Button -->
      <button class="btn-viewer-action btn-download-pdf" onclick="downloadPdfDirect()" title="Download PDF directly to your device">
        <i class="fa-solid fa-download"></i> Download PDF
      </button>
      <button class="btn-viewer-action btn-print" onclick="window.print()" title="Print or Save as Vector PDF">
        <i class="fa-solid fa-print"></i> Print / Save
      </button>
      <a class="btn-viewer-action btn-edit" id="btnEditStudio" href="index.html" title="Open this document in AI Studio">
        <i class="fa-solid fa-pen-to-square"></i> Edit in Studio
      </a>
    </div>
  </div>

  <!-- Document Viewport -->
  <div class="document-viewport">
    <div class="printable-sheet" id="sheetContainer">
      <div class="viewer-loading" id="loadingState">
        ⏳ Loading official document details...
      </div>
      <div id="documentContent" style="display:none"></div>
    </div>
  </div>

  <!-- Required Scripts for Dynamic Document Rendering -->
  <script src="js/config.js?v=7.0"></script>
  <script src="js/data.js?v=7.0"></script>
  <script src="js/preview.js?v=7.0"></script>
  <script src="js/pdf-generator.js?v=7.0"></script>
  <script src="js/docx-generator.js?v=7.0"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const quoteRef = urlParams.get('ref') || urlParams.get('load') || 'LEDMC-DOCUMENT';
      const clientName = urlParams.get('client') || urlParams.get('client_name') || urlParams.get('name') || '';
      const clientPhone = urlParams.get('phone') || urlParams.get('client_phone') || '';
      const clientEmail = urlParams.get('email') || urlParams.get('client_email') || '';
      const destination = urlParams.get('dest') || urlParams.get('destination') || '';
      const paxCount = urlParams.get('pax') || '2';
      const travelDate = urlParams.get('date') || urlParams.get('travel_date') || '';
      const returnDate = urlParams.get('return_date') || '';
      const initialDocType = urlParams.get('doctype') || 'quotation';
      const autoPrint = urlParams.get('print') === '1';

      document.getElementById('refBadge').textContent = quoteRef;
      document.getElementById('btnEditStudio').href = `index.html?load_client=${encodeURIComponent(clientName)}&dest=${encodeURIComponent(destination)}&lead_id=${encodeURIComponent(quoteRef)}&phone=${encodeURIComponent(clientPhone)}&email=${encodeURIComponent(clientEmail)}&pax=${encodeURIComponent(paxCount)}`;

      let quotation = null;

      // 1. Try fetching from cPanel MySQL API
      try {
        const res = await fetch(`api/get_quotations.php`);
        if (res.ok) {
          const json = await res.json();
          if (json.success && json.quotations) {
            quotation = json.quotations.find(q => q.quote_ref === quoteRef);
          }
        }
      } catch (e) {
        console.warn('Backend fetch notice:', e);
      }

      // 2. Fallback to localStorage
      if (!quotation) {
        try {
          const localList = JSON.parse(localStorage.getItem('dmc_saved_quotations_v1') || '[]');
          quotation = localList.find(q => q.quote_ref === quoteRef);
        } catch (e) {}
      }

      // 3. Smart Dynamic Generation for ANY Client/Proposal (Never fail with 'Not Found')
      if (!quotation) {
        // Load master template structure
        loadSampleDataset('reference');
        
        if (typeof QuotationData !== 'undefined') {
          if (clientName) QuotationData.package.clientName = clientName;
          if (quoteRef) QuotationData.package.quotationNo = quoteRef;
          if (destination) {
            QuotationData.package.destination = destination;
            QuotationData.package.packageTitle = `${destination.toUpperCase()} — EXCLUSIVE TAILORMADE PROPOSAL`;
          }
          if (clientPhone) QuotationData.package.clientPhone = clientPhone;
          if (clientEmail) QuotationData.package.clientEmail = clientEmail;
          if (paxCount) QuotationData.package.pax = `${paxCount} Adults`;
          if (travelDate) QuotationData.package.travelDate = travelDate;
          if (initialDocType) QuotationData.activeDocType = initialDocType;

          quotation = { full_data: QuotationData };
        }
      }

      const loadingDiv = document.getElementById('loadingState');
      const contentDiv = document.getElementById('documentContent');

      // Render the official printable document
      try {
        const fullData = (quotation && quotation.full_data) ? quotation.full_data : (quotation || QuotationData);
        window.currentQuotationData = fullData;
        window.QuotationData = fullData;

        // Check Client Gating: If Draft and not previewing internally
        const urlParams = new URLSearchParams(window.location.search);
        const isInternalPreview = urlParams.get('preview') === '1' || urlParams.get('from_admin') === '1';
        const qStatus = quotation?.status || fullData?.status || 'Confirmed';

        if (qStatus === 'Draft' && !isInternalPreview) {
          loadingDiv.innerHTML = `
            <div style="max-width:540px; margin:60px auto; text-align:center; padding:40px 30px; background:#FFFFFF; border-radius:16px; box-shadow:0 10px 25px rgba(15,23,42,0.06); border:1px solid #E2E8F0;">
              <div style="width:60px; height:60px; border-radius:50%; background:#FEF3C7; color:#B45309; font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </div>
              <h2 style="font-size:20px; font-weight:800; color:#0F172A; margin-bottom:8px;">Proposal Under Final Review</h2>
              <p style="font-size:14px; color:#64748B; line-height:1.6; margin-bottom:20px;">
                This quotation is currently an internal working draft and undergoing final tariff verification by Let's Explore DMC. Your final approved itinerary and dual tariff proposal will be accessible once published.
              </p>
              <div style="font-size:12px; font-weight:700; color:#2563EB; background:#EFF6FF; padding:8px 16px; border-radius:9999px; display:inline-block;">
                Quotation Ref: ${quoteRef || 'PENDING'}
              </div>
            </div>
          `;
          return;
        }

        // Sync active format button
        const activeDocType = fullData.activeDocType || initialDocType || 'quotation';
        document.querySelectorAll('.btn-fmt-pill').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.doctype === activeDocType);
        });

        // Render clean printable HTML
        const html = Preview.buildQuotationHTML(fullData, true);
        contentDiv.innerHTML = html;
        loadingDiv.style.display = 'none';
        contentDiv.style.display = 'block';

        if (autoPrint) {
          setTimeout(() => window.print(), 600);
        }
      } catch (renderErr) {
        loadingDiv.innerHTML = `
          <div style="color: #DC2626; font-weight: 700;">Render Error</div>
          <p style="font-size: 13px; color: #64748B;">${renderErr.message}</p>
        `;
      }
    });

    /**
     * Download PDF Directly (Uses html2pdf with fallback to browser print)
     */
    function downloadPdfDirect() {
      const element = document.getElementById('sheetContainer');
      const client = (window.currentQuotationData?.package?.clientName || 'Quotation').replace(/[^a-zA-Z0-9_-]/g, '_');
      const ref = (window.currentQuotationData?.package?.quotationNo || 'DMC').replace(/[^a-zA-Z0-9_-]/g, '');
      const filename = `LetsExplore_${client}_${ref}.pdf`;

      if (typeof html2pdf !== 'undefined') {
        const opt = {
          margin: [6, 6, 6, 6],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      } else {
        window.print();
      }
    }

    /**
     * Switch format directly from viewer bar
     */
    function switchViewerFormat(docType) {
      if (!window.currentQuotationData) return;
      window.currentQuotationData.activeDocType = docType;
      window.QuotationData = window.currentQuotationData;

      document.querySelectorAll('.btn-fmt-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.doctype === docType);
      });

      const html = Preview.buildQuotationHTML(window.currentQuotationData, true);
      const contentDiv = document.getElementById('documentContent');
      if (contentDiv) {
        contentDiv.innerHTML = html;
      }
    }
  </script>
</body>
</html>
