<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Explore DMC — Private Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4F7FB;
            padding: 24px;
            position: relative;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border: 1px solid #DCE4EF;
            border-radius: 20px;
            padding: 44px 36px;
            box-shadow: 0 10px 30px rgba(23, 54, 93, 0.08), 0 2px 6px rgba(23, 54, 93, 0.04);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: #DCEBFA;
            border: 1px solid rgba(57, 119, 184, 0.25);
            color: #3977B8;
            font-size: 26px;
            margin-bottom: 14px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: #17365D;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #17365D;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 15px;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            height: 46px;
            padding: 0 16px 0 46px;
            background: #F8FAFC;
            border: 1px solid #DCE4EF;
            border-radius: 10px;
            color: #334155;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #3977B8;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(57, 119, 184, 0.12);
        }

        .form-control:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: #3977B8;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
        }

        .password-toggle:hover {
            color: #17365D;
        }

        .btn-login {
            width: 100%;
            height: 46px;
            margin-top: 10px;
            background: linear-gradient(135deg, #3977B8 0%, #2D6298 100%);
            border: none;
            border-radius: 10px;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(57, 119, 184, 0.25);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #4383c7 0%, #346ea8 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(57, 119, 184, 0.32);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .login-alert.error {
            background: #FEE2E2;
            border: 1px solid #FECACA;
            color: #DC2626;
        }

        .login-alert.success {
            background: #E6F8F0;
            border: 1px solid #A7F3D0;
            color: #059669;
        }

        .private-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 12px;
            color: #64748B;
            font-weight: 500;
        }

        .private-badge i {
            color: #3977B8;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo-badge">
                <i class="fa-solid fa-file-shield"></i>
            </div>
            <h1 class="brand-title">Let's Explore DMC</h1>
            <p class="brand-subtitle">Private PDF System & Admin Portal</p>
        </div>

        <div id="loginAlert" class="login-alert"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" class="form-control" placeholder="admin or your email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fa-solid fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginSubmitBtn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Sign In to Dashboard</span>
            </button>
        </form>

        <div class="private-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Authorized Management Access Only</span>
        </div>
    </div>

    <script>
        // Check if already authenticated
        fetch('../api/login.php')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.user) {
                    window.location.href = 'index.html';
                }
            })
            .catch(() => {});

        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Form Submit
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('loginAlert');
        const submitBtn = document.getElementById('loginSubmitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alertBox.className = 'login-alert success';
                    alertBox.style.display = 'flex';
                    alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + (data.message || 'Access granted. Redirecting...');
                    setTimeout(() => {
                        window.location.href = data.redirect || '../index.html';
                    }, 500);
                } else {
                    alertBox.className = 'login-alert error';
                    alertBox.style.display = 'flex';
                    alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + (data.error || 'Authentication failed.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
                }
            } catch (err) {
                alertBox.className = 'login-alert error';
                alertBox.style.display = 'flex';
                alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Unable to reach backend server.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
